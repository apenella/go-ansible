---

- hosts: server
  vars:
    extravar1: na
    extravar2: na

  tasks:
    - name: Gather facts
      ansible.builtin.setup:
        gather_subset:
          - all_ipv4_addresses

    - name: show values
      debug:
        msg: |
          {{ hostvars['server']['ansible_facts']['hostname'] }}[{{ hostvars['server']['ansible_facts']['default_ipv4']['address'] }}] (port: {{ hostvars['server']['ansible_port'] }})
          - {{ extravar1 }}
          - {{ extravar2 }}